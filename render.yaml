services:
  - type: web
    name: portal-72-horas
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db-72-horas
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://portal-72-horas.onrender.com
      - key: EMAIL_FROM
        value: proyectos@fidatec.org.co
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: proyectos@fidatec.org.co
      - key: SMTP_PASS
        sync: false # Configurar en el dashboard: app password de Gmail
      - key: CRON_SECRET
        generateValue: true
      - key: TZ
        value: America/Bogota

  - type: cron
    name: reminders-72-horas
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: |
      curl -fsSL -H "x-cron-secret: ${CRON_SECRET}" "${NEXT_PUBLIC_APP_URL}/api/cron/reminders"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://portal-72-horas.onrender.com
      - key: CRON_SECRET
        fromService:
          name: portal-72-horas
          type: web
          property: envVars.CRON_SECRET

databases:
  - name: db-72-horas
    databaseName: horasconmaria
    user: horasconmaria
    plan: starter
